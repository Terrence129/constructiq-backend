services:
  postgres:
    image: postgres:16
    container_name: constructiq-postgres
    environment:
      POSTGRES_DB: constructiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - constructiq-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: constructiq-redis
    ports:
      - "6379:6379"
  backend:
    build: .
    container_name: constructiq-backend
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/constructiq
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-secret-key-change-this-at-least-32-chars
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://constructiq-alb-722189741.ap-southeast-1.elb.amazonaws.com,https://constructiq-frontend-kap8vidxw-tc129.vercel.app,https://constructiq.chenyaqi.com
    ports:
      - "8080:8080"

volumes:
  constructiq-postgres-data:
